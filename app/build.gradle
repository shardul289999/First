plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pureview.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pureview.browser'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
