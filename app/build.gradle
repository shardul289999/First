plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pureview.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pureview.browser'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
